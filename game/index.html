<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5bf83">
  <title>PALMSHADE HEAT</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world" tabindex="0" aria-label="Palmshade Heat — drive, walk and explore a sun-soaked original city"></canvas>
  <div id="vignette"></div>
  <div id="hud" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">P<span>H</span></span><div>PALMSHADE <b>HEAT</b><small>THE CITY NEVER COOLS DOWN.</small></div></div>
      <div class="wanted-block"><div id="wanted" aria-label="Wanted level">☆☆☆☆☆</div><small id="heat-status">OFF THE RADAR</small></div>
      <div class="wallet"><small>CASH</small><strong id="cash">$0</strong></div>
      <div class="clock"><strong id="clock">17:25</strong><small id="clock-label">GOLDEN HOUR / DAY 01</small></div>
    </header>
    <div class="location"><span class="live-dot"></span><span id="district">SUNSET MILE</span><small id="street">CINDER AVENUE</small></div>
    <div class="vitals"><div class="health-row"><span>＋</span><div class="bar" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="health-bar"></i></div><b id="health-value">100</b></div><div id="weapon">FISTS <span>J / CLICK</span></div><div id="car-status"></div></div>
    <div id="bust" hidden><span>BUSTED</span><div class="bar"><i id="bust-bar"></i></div></div>
    <div id="prompt" hidden></div>
    <div id="toast" hidden></div>
    <div class="objective-panel"><div class="objective-icon">◆</div><div><small id="mission-label">MARA VOSS / INCOMING JOB</small><strong id="objective"></strong><span id="mission-detail"></span></div><div id="mission-timer"></div></div>
    <aside class="radar"><div class="radar-head"><span>PALMSHADE</span><span>N ↑</span></div><canvas id="minimap" width="240" height="180" aria-label="Minimap"></canvas><div class="radar-foot"><span>◆ OBJECTIVE</span><span>M — MAP</span></div></aside>
    <div class="bottom-controls"><span><kbd>W A S D</kbd> MOVE / DRIVE</span><span><kbd>E</kbd> ENTER / EXIT</span><span><kbd>J</kbd> PUNCH <kbd>K</kbd> FIRE</span><span><kbd>P</kbd> PAUSE</span></div>
  </div>
  <div id="overlay"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="js/city.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/traffic.js"></script>
  <script src="js/police.js"></script>
  <script src="js/player.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
